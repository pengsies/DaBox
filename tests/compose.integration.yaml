name: relayforge-integration

services:
  edge:
    ports: !override
      - "127.0.0.1:8443:443"
    volumes: !override
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${RF_TEST_SECRETS:?set RF_TEST_SECRETS}/tls:/etc/nginx/tls:ro
      - type: bind
        source: ${RF_TEST_WORKER:?set RF_TEST_WORKER}
        target: /etc/nginx/artifacts/relay-worker
        read_only: true
        bind:
          create_host_path: false

  access:
    volumes:
      - ${RF_TEST_SECRETS:?set RF_TEST_SECRETS}/job-signing.pem:/run/secrets/job-signing.pem:ro

networks:
  edge_net:
    driver_opts:
      com.docker.network.bridge.name: rfit-edge0
  frontend_net:
    driver_opts:
      com.docker.network.bridge.name: rfit-front0
  db_net:
    driver_opts:
      com.docker.network.bridge.name: rfit-db0
