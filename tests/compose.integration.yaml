name: relayforge-integration

services:
  edge:
    ports: !override
      - "127.0.0.1:8443:443"
    volumes:
      - ${RF_TEST_SECRETS:?set RF_TEST_SECRETS}/tls:/etc/nginx/tls:ro

  access:
    volumes:
      - ${RF_TEST_SECRETS:?set RF_TEST_SECRETS}/job-signing.pem:/run/secrets/job-signing.pem:ro

networks:
  edge_net:
    driver_opts:
      com.docker.network.bridge.name: rfit-edge0
  frontend_net:
    driver_opts:
      com.docker.network.bridge.name: rfit-front0
  db_net:
    driver_opts:
      com.docker.network.bridge.name: rfit-db0
