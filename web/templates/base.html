<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RelayForge{% endblock %} · Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

    <a class="brand" href="{{ url_for('index') }}"><span class="mark">R</span> RelayForge</a>

  <main>{% block content %}{% endblock %}</main>
  <footer>RelayForge · Access Portal</footer>
</body>
</html>
